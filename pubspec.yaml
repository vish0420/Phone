name: viggu_audio_player
description: A personal local music player for Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.46
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  share_plus: ^10.1.4
  audio_session: ^0.1.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
