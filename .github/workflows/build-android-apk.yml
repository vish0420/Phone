name: Build Viggu Audio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name viggu_audio .
          fi
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find Android app Gradle file")

          lines = gradle.read_text().splitlines()
          changed = False
          for index, line in enumerate(lines):
              if re.match(r"^\s*compileSdk\s*=", line):
                  lines[index] = re.sub(r"compileSdk\s*=.*$", "compileSdk = 36", line)
                  changed = True
              elif re.match(r"^\s*compileSdkVersion\s+", line):
                  lines[index] = re.sub(r"compileSdkVersion\s+.*$", "compileSdkVersion 36", line)
                  changed = True

          if not changed:
              raise SystemExit(f"Could not locate compileSdk setting in {gradle}")
          gradle.write_text("\n".join(lines) + "\n")
          print(f"Set compile SDK to 36 in {gradle}")
          PY
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: viggu-audio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
